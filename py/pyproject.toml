[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "minindex"
version = "0.1.2"
description = "Minimal, memory-mapped local text indexing for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/undo-git-pull/minindex"
Repository = "https://github.com/undo-git-pull/minindex"

[tool.maturin]
features = ["pyo3/extension-module"]
